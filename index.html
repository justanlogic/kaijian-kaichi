<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>开健开吃 · 训练与营养记录</title>
  <meta name="description" content="开健开吃：把每天的训练与饮食记在一处。支持离线使用，数据保存在本机浏览器。">
  <meta name="theme-color" content="#080d0b" id="meta-theme">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="开健开吃">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-lime" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#dcff86"/>
        <stop offset="1" stop-color="#79d63c"/>
      </linearGradient>
      <linearGradient id="grad-orange" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc48a"/>
        <stop offset="1" stop-color="#ff8a45"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <rect width="32" height="32" rx="9" fill="#b4ef4a"/>
            <rect x="7.5" y="17.5" width="4" height="6.5" rx="2" fill="#0c1206"/>
            <rect x="14" y="13.5" width="4" height="10.5" rx="2" fill="#0c1206"/>
            <rect x="20.5" y="9" width="4" height="15" rx="2" fill="#0c1206"/>
            <circle cx="22.5" cy="5.6" r="1.9" fill="#ff9d5c"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>开健开吃</strong>
          <small>训练 · 营养</small>
        </span>
      </div>

      <nav class="rail-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-act="nav" data-view="overview">
          <span class="nav-ico" data-ico="gauge"></span><span>概览</span>
        </button>
        <button class="nav-item" type="button" data-act="nav" data-view="fitness">
          <span class="nav-ico" data-ico="dumbbell"></span><span>训练</span>
        </button>
        <button class="nav-item" type="button" data-act="nav" data-view="nutrition">
          <span class="nav-ico" data-ico="apple"></span><span>营养</span>
        </button>
        <button class="nav-item" type="button" data-act="nav" data-view="settings">
          <span class="nav-ico" data-ico="sliders"></span><span>设置</span>
        </button>
      </nav>

      <div class="rail-card" id="rail-goal"></div>

      <div class="rail-foot">
        <button class="install-btn" type="button" data-act="install" id="install-btn" hidden>
          <span data-ico="install"></span><span>安装到桌面</span>
        </button>
        <p class="rail-note">
          <span class="net" data-net><i></i><span>在线</span></span>
          <span>数据仅保存在本机</span>
        </p>
      </div>
    </aside>

    <div class="shell">
      <header class="mobile-bar">
        <div class="brand compact">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <rect width="32" height="32" rx="9" fill="#b4ef4a"/>
              <rect x="7.5" y="17.5" width="4" height="6.5" rx="2" fill="#0c1206"/>
              <rect x="14" y="13.5" width="4" height="10.5" rx="2" fill="#0c1206"/>
              <rect x="20.5" y="9" width="4" height="15" rx="2" fill="#0c1206"/>
              <circle cx="22.5" cy="5.6" r="1.9" fill="#ff9d5c"/>
            </svg>
          </span>
          <strong>开健开吃</strong>
        </div>
        <span class="net" data-net><i></i><span>在线</span></span>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" aria-label="页面切换">
    <button class="tab is-active" type="button" data-act="nav" data-view="overview">
      <span class="tab-ico" data-ico="gauge"></span><span>概览</span>
    </button>
    <button class="tab" type="button" data-act="nav" data-view="fitness">
      <span class="tab-ico" data-ico="dumbbell"></span><span>训练</span>
    </button>
    <button class="tab" type="button" data-act="nav" data-view="nutrition">
      <span class="tab-ico" data-ico="apple"></span><span>营养</span>
    </button>
    <button class="tab" type="button" data-act="nav" data-view="settings">
      <span class="tab-ico" data-ico="sliders"></span><span>设置</span>
    </button>
  </nav>

  <dialog id="dlg" class="sheet" aria-labelledby="dlg-title"></dialog>
  <div class="toaster" id="toaster" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">「开健开吃」需要启用 JavaScript 才能记录训练与饮食数据。</div>
  </noscript>

  <script defer src="./vendor/workbuddy-cloud-sdk.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
