name: 功能建议
description: 提出一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景，而不是只写“求加 XX”。场景越具体，越容易被排进版本。
  - type: textarea
    id: problem
    attributes:
      label: 你在什么场景下需要它
      placeholder: 例如：每周日想回顾这一周的训练容量和蛋白质达标天数
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
      placeholder: 描述你想象中的操作与结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在你怎么解决
      description: 用其他 App / 表格 / 手动计算？
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 训练
        - 营养
        - 身体数据
        - 目标推荐
        - 云同步
        - 界面 / 可访问性
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我看过 Roadmap，确认没有重复
          required: true
